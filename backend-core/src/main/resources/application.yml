spring:
  application:
    name: loadpace-backend-core
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/loadpace}
    username: ${DB_USERNAME:loadpace}
    password: ${DB_PASSWORD:loadpace}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

loadpace:
  security:
    jwt:
      # 256-bit secret (base64). Override in production via LOADPACE_JWT_SECRET.
      secret: ${LOADPACE_JWT_SECRET:c2VjcmV0LWxvYWRwYWNlLWRldmVsb3BtZW50LWtleS1jaGFuZ2UtbWU=}
      expiration-ms: ${LOADPACE_JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${LOADPACE_CORS_ORIGINS:http://localhost:5173}
